# Publish a tagged version to npm.
#
# Today: the `NPM_TOKEN` repository secret (a granular npm token) signs the publish.
# Target: trusted publishing (no stored credential, GitHub signs the request, npm checks
# the signature and attaches provenance). Setting the package's trusted publisher on npm
# needs William's npm sign-in (TOTP or passkey); once it points at this repository and
# this workflow file, delete the secret and the `NODE_AUTH_TOKEN` line below.
name: release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # A tag for a version already on npm is history, not a release: stop quietly.
      - id: published
        run: |
          name="$(node -p 'require("./package.json").name')"
          v="$(node -p 'require("./package.json").version')"
          if npm view "$name@$v" version >/dev/null 2>&1; then
            echo "$name@$v is already on npm"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # Trusted publishing needs a recent npm; the one bundled with node may predate it.
      - if: steps.published.outputs.skip != 'true'
        run: npm install -g npm@latest
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
